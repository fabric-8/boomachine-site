# Deploys the public site (repo root, without drafts/) to boomachine.app on ALL-INKL.
# Runs only when started by hand: Actions tab → "Deploy to boomachine.app" → Run workflow,
# or `gh workflow run deploy-allinkl.yml -R fabric-8/boomachine-site`.
#
# The FTP user behind the secrets is locked to /boomachine.app/ on the web space,
# so this job cannot touch any other site in the account.
name: Deploy to boomachine.app

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only log in and list the server folder, upload nothing"
        type: boolean
        default: false
      debug:
        description: "Verbose FTP log (lftp debug; secrets are masked by GitHub)"
        type: boolean
        default: false

concurrency:
  group: deploy-allinkl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: boomachine.app
      url: https://boomachine.app/
    env:
      FTP_HOST: ${{ vars.ALLINKL_FTP_HOST }}
      FTP_USER: ${{ secrets.ALLINKL_FTP_USER }}
    steps:
      - uses: actions/checkout@v4

      # Large files (*.zip, see .gitattributes) are in Git LFS. Cache the LFS objects
      # so only a changed file costs LFS bandwidth, not every deploy.
      - name: List LFS objects for the cache key
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull LFS files
        run: git lfs pull && git lfs ls-files

      - name: Stage public files
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude '.git*' --exclude '.github/' --exclude '_deploy/' \
            --exclude 'drafts/' --exclude 'README.md' --exclude '.nojekyll' --exclude '.lfs-ids' \
            ./ _deploy/
          pointers=$(find _deploy -type f -size -1k -exec grep -l 'git-lfs.github.com/spec' {} + || true)
          if [ -n "$pointers" ]; then echo "::error::LFS pointer instead of file: $pointers"; exit 1; fi
          echo "Files to publish:"; (cd _deploy && find . -type f -exec ls -l {} + | awk '{print $5, $9}' | sort -k2)

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Sync to ALL-INKL over FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.ALLINKL_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$LFTP_PASSWORD" \
            || { echo "::error::ALLINKL_FTP_HOST variable or FTP secrets missing"; exit 1; }
          if [ "${{ inputs.check_only }}" = "true" ]; then
            ACTION="echo Login OK. Server folder above, nothing uploaded."
          else
            ACTION="mirror --reverse --delete --verbose --parallel=4 _deploy/ ./"
          fi
          DEBUG=""
          if [ "${{ inputs.debug }}" = "true" ]; then DEBUG="debug 5;"; fi
          lftp -c "$DEBUG set cmd:fail-exit yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            set ssl:verify-certificate true; set net:max-retries 3; \
            open --env-password -u $FTP_USER $FTP_HOST; cls -la; $ACTION"

      - name: Check the live site
        if: ${{ !inputs.check_only }}
        run: |
          for url in https://boomachine.app/ https://boomachine.app/legal.html https://boomachine.app/support.html https://boomachine.app/privacy.html https://boomachine.app/press/boo-machine-press-kit.zip; do
            code=$(curl -s -o /dev/null -r 0-0 -w '%{http_code}' "$url")
            echo "$code $url"
            case "$code" in 200|206) ;; *) exit 1 ;; esac
          done
