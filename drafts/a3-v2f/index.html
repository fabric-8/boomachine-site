<style>
@font-face{font-family:"Jacquard12";src:url("fonts/Jacquard12-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url("fonts/Barlow-Medium.woff2") format("woff2");font-weight:500;font-display:swap}

:root{
  --ink:#000; --case:#292724; --well:#1E1E1E; --key:#282828; --key-down:#1C1C1C;
  --paper:#EEE8DF; --row:#C4BFBA; --muted:#A19A94; --bronze:#B39A78;
  --amber:#FFB347; --amber-dim:#C87F1E; --red:#F90000;
  --gut:clamp(16px,4vw,48px);

  /* disc radius on screen — everything in the rig is derived from this */
  --Tr:min(34vw,21.5svh);
  /* where the disc centre is pinned, measured from the top of the stage */
  --disc-y:43%;
  --tilt-x:0deg; --tilt-y:0deg;
  /* how hard the reflection is screened onto the photograph */
  --light-op:.45;
}

@property --dy{syntax:"<number>";inherits:false;initial-value:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink); color:var(--row);
  font-family:"Barlow",system-ui,sans-serif; font-weight:500; font-size:16px; line-height:1.5;
  min-height:100svh; display:flex; flex-direction:column; overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit}
::selection{background:var(--amber);color:#160D02}
:focus-visible{outline:2px solid var(--bronze);outline-offset:4px}

/* ============ hero ============ */
.hero{
  position:relative; flex:1 1 auto; min-height:560px;
  display:block; overflow:hidden;
  /* the room the machine sits in: one cold pool of light, nothing else */
  background:
    radial-gradient(120% 70% at 50% 44%, #15120E 0%, #0A0908 38%, #000 72%);
}

/* ---- masthead ---- */
.masthead{
  position:absolute; left:0; right:0; top:0;
  padding:clamp(18px,4.2svh,52px) var(--gut) 0;
  text-align:center; pointer-events:none;
}
/* ---- the title and the room light live in title.css (drop-in) ----
   V2's .title / .title::after / .title .on / @keyframes power were removed
   from this inline block; title.css redefines all four. Size, position and the
   overlap with the disc are unchanged from v2b — only the z-order moved. ---- */
/* v2f: the strapline ("A cursed disc player for your iPhone.") is GONE — the
   client cut it. Its rule went with it; the space it held is handed back to
   the control by the taller `bottom` on .unlock-zone below, so the slide sits
   where it did (a few px higher), not 35 px lower. */
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{
  margin:0; font-size:11px; letter-spacing:.7px; color:#8E8882;
  text-shadow:0 0 12px #000,0 0 24px rgba(0,0,0,.9);
  opacity:0; animation:fadein .8s ease 1.05s both;
}

/* ---- stage: the unit (hand + disc, one photograph) and its reflection ---- */
.stage{
  position:absolute; inset:0;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.plane{
  position:absolute; inset:0;
  perspective:1400px; perspective-origin:50% var(--disc-y);
}
.plane.veil{
  /* no ghosting: the unit runs at full strength everywhere it matters. All that
     is left is a dissolve at the very bottom so the arm does not collide with
     the control. */
  --veil:linear-gradient(to bottom,#000 0 78%,rgba(0,0,0,.5) 90%,transparent 100%);
  -webkit-mask-image:var(--veil); mask-image:var(--veil);
}
.rig{
  position:absolute; left:50%; top:var(--disc-y); width:0; height:0;
  transform-style:preserve-3d;
  transform:rotateY(var(--tilt-x)) rotateX(var(--tilt-y));
  transition:transform .6s cubic-bezier(.16,.64,.32,1);
}

/* Per-hand placement, derived from a3/mattes/disc-<name>.json so the
   photographed disc lands on exactly the same screen point for all three hands:
     width = --Tr / (r% / 100)            height = width * 1750/1400
     left  = -cx% * width                 top    = -cy% * height
   By construction the disc centre of the unit image sits on the rig origin and
   its radius is exactly --Tr. Unchanged from v2b: the unit files use the same
   1400x1750 frame and the same disc circle as the mattes. */
/* v2f: --dy is a per-hand vertical nudge, in units of --Tr (the disc radius),
   POSITIVE = up. It is folded into `top` in this one rule, which every plane
   shares (.unit, .lbox, .sbox all carry the same .l-* class), so a hand and
   its light box and its spill box cannot come apart. The reflection and the
   spill correct for it — see fx.js drawRefl() and .sbox .d-spill in fx.css. */
.l-vampire{--dy:.26;width:calc(var(--Tr)*3.53995);left:calc(var(--Tr)*-1.70045);top:calc(var(--Tr)*-1.62479 - var(--Tr)*var(--dy))}
.l-wolf   {--dy:.15;width:calc(var(--Tr)*3.31422);left:calc(var(--Tr)*-1.55536);top:calc(var(--Tr)*-1.54724 - var(--Tr)*var(--dy))}
.l-witch  {--dy:-.10;width:calc(var(--Tr)*2.96165);left:calc(var(--Tr)*-1.24756);top:calc(var(--Tr)*-2.29602 - var(--Tr)*var(--dy))}
/* ...and the disc centre inside that box, as a fraction of the box, so the
   reflection AND the amber spill can be positioned in the UNIT's coordinate
   frame (= disc_pct). Both planes use the same three boxes. */
.p-light .l-vampire,.p-spill .l-vampire{--fx:48.036%;--fy:36.719%}
.p-light .l-wolf   ,.p-spill .l-wolf   {--fx:46.930%;--fy:37.348%}
.p-light .l-witch  ,.p-spill .l-witch  {--fx:42.124%;--fy:62.020%}

/* ---- the unit plane: 9 photographs, one visible ----
   hand x art. All nine stay in the DOM and stay loaded so window.booUnit.set()
   can switch art independently of the hand later; only the first is preloaded. */
.unit{
  position:absolute; max-width:none; height:auto; aspect-ratio:1400/1750;
  opacity:0; transition:opacity 1.05s ease; pointer-events:none;
}
.unit.is-on{opacity:1}

/* ---- the light plane: the reflection, in the unit's frame ----
   One .lbox per hand, sized and placed exactly like that hand's unit, carrying
   that hand's face mask (white = disc face visible, black over fingers and
   outside the disc) at mask-size 100% 100% — so the mask needs no arithmetic
   and cannot drift from the photograph. Inside it, the 2x--Tr reflection is
   centred on the photographed disc centre (--fx/--fy).
   The whole plane is screened onto the page, so the layers inside can stay
   exactly as disc.css paints them (black = off) and nothing can darken. */
.lbox{
  position:absolute; aspect-ratio:1400/1750;
  opacity:0; transition:opacity 1.05s ease; pointer-events:none;
  /* the face mask below must not reach the page: this group is closed */
  isolation:isolate;
}
.lbox.is-on{opacity:1}
.lbox.l-vampire{--face:url("assets/face-vampire.png")}
.lbox.l-wolf   {--face:url("assets/face-wolf.png")}
.lbox.l-witch  {--face:url("assets/face-witch.png")}
.lbox .disc-light{
  left:calc(var(--fx) - var(--Tr));
  top:calc(var(--fy) - var(--Tr));
}
/* The face mask, applied by MULTIPLYING it into the light instead of with
   mask-image. Same result — white keeps the light, black kills it, grey
   feathers it — because the plane is screened onto the page and black is
   screen's no-op, which is the convention disc.css is written in.
   Why not mask-image: Chromium refuses to load a mask image over file://
   (each file is its own opaque origin, and a mask may not be cross-origin),
   so `mask-image:url(face-*.png)` silently masks the layer away to NOTHING
   when index.html is opened from disk — which is how this draft is reviewed.
   Verified: over http the mask-image version works, from disk it does not.
   Multiply has no such rule and behaves identically in both. */
.lbox .d-face{
  position:absolute; inset:0; pointer-events:none;
  background-image:var(--face);
  background-size:100% 100%; background-repeat:no-repeat;
  mix-blend-mode:multiply;
}

/* ---- slide to unlock ----
   v2f: the control itself (track, knob, label, the furnace behind it) lives in
   slide.css and slide.js. What stays here is only the ZONE it sits in. */
.unlock-zone{
  /* v2f: was clamp(14px,3.4svh,40px). The zone is anchored to the BOTTOM, so
     dropping the strapline from the top of the column does not move the
     control at all — measured, 719.4 px both before and after at 1440x900.
     What it does leave is 35 px of reclaimed air above it, and this small
     lift (about 7 px at 1440x900, 6 px at 375) spends a little of it so the
     control sits where it did, a touch higher, with the rest going to the
     hand. */
  position:absolute; left:0; right:0; bottom:clamp(18px,4.2svh,46px);
  padding-inline:var(--gut);
  display:flex; flex-direction:column; align-items:center; gap:clamp(10px,1.6svh,16px);
}
.unlock-zone::before{
  content:""; position:absolute; z-index:-1; left:0; right:0; bottom:-40px;
  top:clamp(-70px,-7svh,-40px);
  background:linear-gradient(to top,#000 26%,rgba(0,0,0,.86) 56%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}

/* ============ footer ============ */
.foot{
  flex:0 0 auto; position:relative; z-index:4;
  display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:6px 26px; padding:clamp(14px,2.2svh,20px) var(--gut);
  border-top:1px solid #15140F; background:#000;
  font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:#838078;
}
.foot a{color:#B3ACA5;text-decoration:none;transition:color .25s}
.foot span a{text-decoration:underline;text-decoration-color:rgba(179,172,165,.45);text-underline-offset:3px}
.foot a:hover{color:var(--paper)}
.foot nav{display:flex;gap:20px}
.foot .made{flex:1 1 320px;text-align:center;letter-spacing:1.2px;text-transform:none;font-size:11px;color:#7E7872}

@media (max-width:860px){
  .foot{justify-content:center;text-align:center;gap:8px 18px}
  .foot .made{order:3;flex:1 1 100%}
}
@media (max-width:520px){
  :root{--Tr:min(40vw,22svh);--disc-y:33%}
  /* v2f: the phone is NOT the desktop rig scaled down — --Tr is 150 px against
     a 54 px letter band there (against 193 px against 146 px at 1440), so the
     desktop --dy would bury "achine" behind the disc (measured: 100 % of some
     columns). A third of the desktop nudge keeps every hand touching the
     letters with the disc under a third of any column. */
  .l-vampire{--dy:.06}
  .l-wolf   {--dy:.06}
  .l-witch  {--dy:-.06}
  .plane.veil{--veil:linear-gradient(to bottom,
    #000 0 74%, rgba(0,0,0,.5) 89%, transparent 100%)}
  .foot{font-size:10px;letter-spacing:1.2px}
  .foot nav{gap:16px}
}
/* short-and-wide: keep the disc from crowding the title */
@media (max-height:760px) and (min-width:861px){
  :root{--Tr:min(30vw,20svh)}
  /* v2f: the disc shrinks here but --disc-y stays at 43 % of a SHORTER hero,
     so the disc is already closer to the (unchanged, 178 px) title than it is
     at 1440x900 — measured, the desktop --dy takes one letter column to 51 %
     hidden. Half the nudge holds the third and still lands both hands on the
     letters. */
  .l-vampire{--dy:.13}
  .l-wolf   {--dy:.09}
  .l-witch  {--dy:-.05}
}

@media (prefers-reduced-motion:reduce){
  .title .on,.note{animation:none;opacity:1}
  .rig,.unit,.lbox,.sbox{transition:none}
}
</style>
<link rel="stylesheet" href="disc.css">
<link rel="stylesheet" href="title.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="slide.css">
<style>
/* ============ z-order, in one place ============
   Nothing between .hero and these elements creates a stacking context, so all
   of them sit in ONE context and these numbers are the whole story. Loaded
   after title.css on purpose: it ships .rl-halo at 1 and .rl-wash at 4.

     1  .rl-halo      the red bulb glowing in the air
     2  .title        THE TITLE IS BEHIND THE HANDS (client's call; the witch's
                      arm covering much of it is accepted)
     3  .p-unit       the photograph: hand + disc, one image
     4  .p-spill      v2d: the sign's amber, masked to the hand's silhouette
     5  .p-light      the reflection, screened onto the photograph
     6  .rl-wash      the red bulb's rim light, over everything on the stage
     7  .fx-motes     v2d: dust drifting in the red light
     8  .fx-grain     v2d: the film the whole thing is shot on
     9  .unlock-zone  the slide control
   (4 and 7-8 are declared in fx.css; the numbers live here.)              */
.p-unit{z-index:3}
.p-light{
  z-index:5;
  /* screen: the reflection may only ADD light. It has to blend with the unit
     plane below it, which lives in a different .plane, so the blend goes on the
     PLANE — .lbox/.rig are already isolated by their mask and their transform. */
  mix-blend-mode:screen;
  opacity:var(--light-op);
}
.rl-wash{z-index:6}
.unlock-zone{z-index:9}
</style>
</head>
<body>

<!-- data-fx: the v2d atmosphere switches plus v2f's `hell`, all on. Drop a
     token to compare; ?fx=none / ?fx=refl / ?fx=-hell does the same from the
     URL. With `hell` off the slide is a plain dark track that still drags,
     still completes and still goes to TestFlight. -->
<main class="hero" id="hero" data-fx="refl grain motes spill plate topglow buzz hell">

  <!-- v2e-b: the sign is a PHOTOGRAPH (assets/title-sign.webp), generated from
       a 2x white-on-black render of this page's own Jacquard 12 setting and
       matted off black — see work/. The <h1> still carries the text at exactly
       the same size and place; it just paints nothing, so the box, the disc
       overlap and the hands-in-front z-order are unchanged. -->
  <div class="masthead">
    <h1 class="title" aria-label="Boo Machine"><span class="plate" aria-hidden="true"></span><img class="signimg" src="assets/title-sign.webp" alt="" aria-hidden="true" width="1883" height="757" fetchpriority="high" decoding="async"><span class="on">Boo Machine</span></h1>
  </div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Change the disc">

    <!-- the unit plane: hand and disc are ONE photograph, 3 hands x 3 arts -->
    <div class="plane veil p-unit"><div class="rig">
      <img class="unit l-vampire is-on" data-hand="0" data-art="0" src="assets/unit-vampire-starter.webp"   alt="A vampire's pale clawed hand holding a disc" width="1400" height="1750" fetchpriority="high">
      <img class="unit l-vampire"       data-hand="0" data-art="1" src="assets/unit-vampire-creatures.webp" alt="A vampire's pale clawed hand holding a disc" width="1400" height="1750" loading="lazy" aria-hidden="true">
      <img class="unit l-vampire"       data-hand="0" data-art="2" src="assets/unit-vampire-coven.webp"     alt="A vampire's pale clawed hand holding a disc" width="1400" height="1750" loading="lazy" aria-hidden="true">

      <img class="unit l-wolf" data-hand="1" data-art="0" src="assets/unit-wolf-starter.webp"   alt="A werewolf's clawed paw holding a disc" width="1400" height="1750" loading="lazy" aria-hidden="true">
      <img class="unit l-wolf" data-hand="1" data-art="1" src="assets/unit-wolf-creatures.webp" alt="A werewolf's clawed paw holding a disc" width="1400" height="1750" loading="lazy" aria-hidden="true">
      <img class="unit l-wolf" data-hand="1" data-art="2" src="assets/unit-wolf-coven.webp"     alt="A werewolf's clawed paw holding a disc" width="1400" height="1750" loading="lazy" aria-hidden="true">

      <img class="unit l-witch" data-hand="2" data-art="0" src="assets/unit-witch-starter.webp"   alt="A witch-creature's hand pinching a disc between two fingers" width="1400" height="1750" loading="lazy" aria-hidden="true">
      <img class="unit l-witch" data-hand="2" data-art="1" src="assets/unit-witch-creatures.webp" alt="A witch-creature's hand pinching a disc between two fingers" width="1400" height="1750" loading="lazy" aria-hidden="true">
      <img class="unit l-witch" data-hand="2" data-art="2" src="assets/unit-witch-coven.webp"     alt="A witch-creature's hand pinching a disc between two fingers" width="1400" height="1750" loading="lazy" aria-hidden="true">
    </div></div>

    <!-- the spill plane (v2d): the title is a lamp. One isolated box per hand
         holding an opaque black field + a soft amber gradient that starts at
         the title's own bounding box and stops at the disc centre, with that
         hand's silhouette multiplied over it. Screened onto the page, so only
         the amber that lands on the photographed hand survives. -->
    <div class="plane veil p-spill" aria-hidden="true"><div class="rig">
      <div class="sbox l-vampire is-on" data-hand="0"><div class="d-spill"></div><div class="d-hand"></div></div>
      <div class="sbox l-wolf"          data-hand="1"><div class="d-spill"></div><div class="d-hand"></div></div>
      <div class="sbox l-witch"         data-hand="2"><div class="d-spill"></div><div class="d-hand"></div></div>
    </div></div>

    <!-- the light plane: one masked box per hand, same tilt rig as the unit -->
    <div class="plane p-light" aria-hidden="true"><div class="rig">
      <div class="lbox l-vampire is-on" data-hand="0">
        <div class="disc-light"><div class="d-iris"></div><div class="d-iris2"></div><div class="d-spec"></div><canvas class="d-refl" width="2" height="2"></canvas></div>
        <div class="d-face"></div>
      </div>
      <div class="lbox l-wolf" data-hand="1">
        <div class="disc-light"><div class="d-iris"></div><div class="d-iris2"></div><div class="d-spec"></div><canvas class="d-refl" width="2" height="2"></canvas></div>
        <div class="d-face"></div>
      </div>
      <div class="lbox l-witch" data-hand="2">
        <div class="disc-light"><div class="d-iris"></div><div class="d-iris2"></div><div class="d-spec"></div><canvas class="d-refl" width="2" height="2"></canvas></div>
        <div class="d-face"></div>
      </div>
    </div></div>

  </div>

  <!-- room light: a failing red bulb over the machine.
       .rl-halo (z1) is the lowest thing on the stage — BEHIND the title (z2);
       .rl-wash (z5) sits above the unit (z3) and its reflection (z4) so the
       grip and the disc rim pick up a red rim from above. Both screen-blend.
       The position of this block in the DOM is load-bearing. -->
  <div class="roomlight" aria-hidden="true">
    <span class="rl-halo"></span>
    <span class="rl-wash"></span>
  </div>

  <!-- v2d: the air (dust in the red light) and the film it is shot on.
       Both are pure atmosphere: aria-hidden, pointer-events:none, and they sit
       under .unlock-zone so nothing touches the control's legibility. -->
  <canvas class="fx-motes" aria-hidden="true" width="2" height="2"></canvas>
  <div class="fx-grain" aria-hidden="true"></div>

  <p id="discNow" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Haunted house</p>

  <!-- v2f: the slide is a hatch on a boiler. .unlock keeps overflow VISIBLE so
       the bloom and the embers can leave the track; the furnace inside is
       clipped by .hatch, which carries the track's radius. Everything is
       driven by --rev / --revp on .unlock-wrap (slide.js -> slide.css).
       `?slide=0.4` parks the knob at 40 % for screenshots; `?slide=done`
       shows the completed state without navigating. -->
  <div class="unlock-zone">
    <div class="unlock-wrap" id="unlockWrap">
      <span class="hell-bloom" aria-hidden="true"></span>
      <div class="unlock" id="unlock">
        <span class="hatch" aria-hidden="true">
          <span class="hell-body"></span>
          <span class="hell-bars"></span>
          <span class="hell-shade"></span>
          <span class="hell-lip"></span>
          <span class="hell-flare"></span>
        </span>
        <span class="unlock-label" id="unlockLabel">slide to join the beta</span>
        <a class="knob" id="knob" href="https://testflight.apple.com/join/jr1YqwtJ" draggable="false"
           aria-label="Slide to join the iPhone beta on TestFlight">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g class="g">
              <circle cx="8" cy="12" r="3.4"/>
              <path d="M11.4 12H21"/>
              <path d="M17.6 12v3.4"/>
              <path d="M20.4 12v2.4"/>
            </g>
          </svg>
        </a>
      </div>
      <canvas class="hell-embers" aria-hidden="true" width="2" height="2"></canvas>
    </div>
    <p class="note">Free on TestFlight · App Store coming soon</p>
  </div>

  <!-- the turbulence that makes the fire churn. One feTurbulence displacing the
       furnace gradients; the <animate> boils it on a 14 s cycle. slide.js
       pauses this SVG's animations under prefers-reduced-motion, and slide.css
       drops the filter entirely while the hatch is shut, so nothing here costs
       a frame until the control is touched. -->
  <svg id="hell-defs" width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute;width:0;height:0;overflow:hidden">
    <filter id="hell-warp" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.041" numOctaves="2" seed="7"
                    result="t">
        <animate attributeName="baseFrequency" dur="14s" repeatCount="indefinite"
                 values="0.013 0.041; 0.019 0.030; 0.011 0.048; 0.016 0.036; 0.013 0.041"
                 calcMode="spline"
                 keySplines=".4 0 .6 1; .4 0 .6 1; .4 0 .6 1; .4 0 .6 1"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="17"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

</main>

<script>
(function(){
  "use strict";
  var HANDS=["vampire","wolf","witch"];
  var ARTS=["starter","creatures","coven"];
  var NAMES=["Haunted house","Creature feature","The coven"];
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)");
  var root=document.documentElement;
  var stage=document.getElementById("stage");
  var live=document.getElementById("discNow");
  var units=[].slice.call(document.querySelectorAll(".p-unit .unit"));
  var lboxes=[].slice.call(document.querySelectorAll(".p-light .lbox"));
  var sboxes=[].slice.call(document.querySelectorAll(".p-spill .sbox"));
  var hand=0, art=0, timer=null;

  /* On this page the hand index and the art index are the same thing: the disc
     changes with the grip that holds it. They are kept as two numbers anyway so
     a later art picker can move one without the other — window.booUnit.set(). */
  function paint(){
    units.forEach(function(el){
      var on=(+el.dataset.hand===hand && +el.dataset.art===art);
      el.classList.toggle("is-on", on);
      /* opacity:0 does not remove a node from the a11y tree, and nine alt
         strings in a row is noise: only the visible unit is exposed. */
      if(on) el.removeAttribute("aria-hidden"); else el.setAttribute("aria-hidden","true");
    });
    lboxes.forEach(function(el){ el.classList.toggle("is-on", +el.dataset.hand===hand); });
    sboxes.forEach(function(el){ el.classList.toggle("is-on", +el.dataset.hand===hand); });
    live.textContent=NAMES[art];
  }
  function idx(v,list,fallback){
    if(typeof v==="string"){ var i=list.indexOf(v); return i<0?fallback:i; }
    if(v===null||v===undefined||v!==v) return fallback;
    return ((+v|0)%3+3)%3;
  }
  function setUnit(h,a){ hand=idx(h,HANDS,hand); art=idx(a,ARTS,art); paint(); }
  function show(i){ setUnit(i,i); }              /* the page's own cycle */

  /* QA hook: hold(true) stops the 7 s cycle so a screenshot cannot land on the
     wrong unit. ?hold=1 does the same from the URL. Default behaviour unchanged. */
  var held=false;
  window.booUnit={
    set:setUnit,
    get hand(){return hand;}, get art(){return art;},
    get handName(){return HANDS[hand];}, get artName(){return ARTS[art];},
    hands:HANDS, arts:ARTS,
    hold:function(v){ held=(v!==false); restart(); return held; }
  };

  function restart(){
    if(timer){clearInterval(timer);timer=null;}
    if(!reduce.matches && !held) timer=setInterval(function(){show(hand+1);},7000);
  }
  function advance(){show(hand+1);restart();}
  stage.addEventListener("click",advance);
  stage.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();advance();}
  });

  /* ---- tilt and the reflection's light angle ---- */
  var tx=0,ty=0,cx=0,cy=0,lastMove=-1e9,holdUntil=-1e9,raf=null;
  function set(){
    /* the page tilts both rigs; nothing inside the light element is transformed
       by the page, only by disc.css */
    root.style.setProperty("--tilt-x",(cx*4).toFixed(2)+"deg");
    root.style.setProperty("--tilt-y",(-cy*4).toFixed(2)+"deg");
    /* third arg true: this loop already smooths, disc.js must not ease again */
    if(window.Disc) window.Disc.setPointer(cx,cy,true);
  }
  function frame(ts){
    if(ts>holdUntil && ts-lastMove>2200){ /* nobody is pointing: a slow idle sway */
      var t=ts/1000;
      tx=Math.sin(t*0.42)*0.55; ty=Math.sin(t*0.27+1.1)*0.42;
    }
    cx+=(tx-cx)*0.075; cy+=(ty-cy)*0.075;
    set();
    raf=requestAnimationFrame(frame);
  }
  function clamp1(v){ v=+v; if(v!==v) return 0; return v<-1?-1:v>1?1:v; }
  /* QA hook: park the pointer at (x,y) and keep the idle sway off it for 5s,
     so a screenshot taken a second later is reproducible. */
  function setPointer(x,y){
    tx=clamp1(x); ty=clamp1(y);
    lastMove=performance.now();
    holdUntil=lastMove+5000;
    return [tx,ty];
  }
  window.__setPointer=setPointer;
  function onMove(e){
    var r=stage.getBoundingClientRect();
    tx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(r.width/2)));
    ty=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/(r.height/2)));
    lastMove=performance.now();
  }
  if(!reduce.matches){
    window.addEventListener("pointermove",onMove,{passive:true});
    raf=requestAnimationFrame(frame);
  }
  /* ?px=&py= — same thing from the URL, for reproducible screenshots */
  try{
    var qs=new URLSearchParams(window.location.search);
    if(qs.has("px")||qs.has("py")) setPointer(qs.get("px")||0, qs.get("py")||0);
    if(qs.get("hold")==="1") held=true;
  }catch(err){}

  /* ---- slide to unlock: moved to slide.js (v2f) ---- */

  show(0); restart();
  reduce.addEventListener("change",function(){ restart(); });
})();
</script>
<script src="title.js"></script>
<script src="fx.js"></script>
<script src="slide.js"></script>
</body>
</html>
